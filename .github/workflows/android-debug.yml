name: Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual run from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin SDK packages explicitly (these inputs are still supported).
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not produced at $APK"
            exit 1
          fi
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK" | grep -E "^(package|application-label:'StepLemon')"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StepLemon-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Size budget check
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # 10 MB hard limit per agents.toml [verification].
          SIZE=$(stat -c%s "$APK")
          LIMIT=$((10 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::APK size $SIZE exceeds 10 MB budget ($LIMIT bytes)"
            exit 1
          fi
          echo "APK size OK: $SIZE bytes ($(awk "BEGIN{printf \"%.2f\", $SIZE/1024/1024}") MB)"